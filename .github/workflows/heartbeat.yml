name: heartbeat-aussenprobe

# Manuelle Außenprobe (kein Alarmweg).
# Der automatische Heartbeat läuft auf Vercel (vercel.json, api/heartbeat.js) und alarmiert per Slack.
# Der frühere GitHub-Cron ist entfernt (07./08.10.2026: 3 geplante Läufe in ~18 h).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Erreichbarkeit pruefen
        env:
          ZIEL: ${{ vars.N8N_HEALTH_URL }}
        run: |
          set -u
          if [ -z "${ZIEL:-}" ]; then
            echo "::error::Repo-Variable N8N_HEALTH_URL fehlt"
            exit 1
          fi
          RC=0
          CODE=$(curl -fsS --max-time 20 --retry 1 --retry-delay 10 -o /dev/null -w '%{http_code}' "$ZIEL" 2>/dev/null) || RC=$?
          ZEIT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [ "$RC" -eq 0 ] && [ "$CODE" = "200" ]; then
            ERGEBNIS="ok"
          else
            ERGEBNIS="fehler"
          fi
          ZEILE="zeit_utc=$ZEIT ergebnis=$ERGEBNIS http=${CODE:-000} curl_exit=$RC"
          echo "$ZEILE"
          echo "$ZEILE" >> "$GITHUB_STEP_SUMMARY"
          if [ "$ERGEBNIS" != "ok" ]; then
            echo "::error::Instanz nicht erreichbar ($ZEILE)"
            exit 1
          fi
